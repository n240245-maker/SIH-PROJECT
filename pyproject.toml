[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mplads-risk-intelligence"
version = "0.1.0"
description = "CSV-first MPLADS data loading and validation foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pandera>=0.23,<0.27",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dateutil>=2.9,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "sentence-transformers>=3.4,<6",
    "geopy>=2.4,<3",
    "PyMuPDF>=1.24,<2",
    "xgboost>=2.1,<4",
    "shap>=0.46,<1",
    "httpx>=0.27,<1",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "orjson>=3.10,<4",
    "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
include = ["intelligence*", "rag*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-ra"
