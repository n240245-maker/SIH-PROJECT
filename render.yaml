services:
  - type: web
    name: mplads-sentinel-api
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install --no-cache-dir -r requirements-deploy.txt
    startCommand: uvicorn backend.main:app --app-dir code --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AS_OF_DATE
        value: "2026-09-01"
      - key: MPLADS_AS_OF_DATE
        value: "2026-09-01"
      - key: MPLADS_ENVIRONMENT
        value: production
      - key: MPLADS_CORS_ORIGINS
        value: https://mplads-sentinel-one.vercel.app
      - key: MPLADS_RUNTIME_DATA_DIR
        value: /tmp/mplads-sentinel-runtime
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: TRANSFORMERS_OFFLINE
        value: "1"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_TIMEOUT_SECONDS
        value: "60"
      - key: GROQ_API_KEY
        sync: false
